worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /var/log/nginx/access.log combined;
    sendfile on;
    keepalive_timeout 65;
    # Allow document/photo uploads (ID OCR etc.) through the proxy.
    client_max_body_size 25m;

    # The React dev server (Vite) — everything that isn't /api or /ws.
    upstream frontend_app {
        server frontend:3000;
    }
    # The Django backend. nginx is attached to the backend's docker network (see
    # docker-compose.yml), so it reaches the backend container directly by its
    # service name over IPv4 — reliable, unlike host.docker.internal which
    # resolved only to an unreachable IPv6 address here.
    upstream backend_api {
        server web:8000;
    }

    # WebSocket upgrade helper: send the Upgrade/Connection headers only when the
    # client actually asked to upgrade (used by live GPS /ws and Vite HMR).
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # ---- Plain HTTP (kept for localhost / non-GPS use, port published as 8080) ----
    server {
        listen 80;
        server_name _;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        location /api/ { proxy_pass http://backend_api; }
        location /ws/  { proxy_pass http://backend_api; }
        location /     { proxy_pass http://frontend_app; }
    }

    # ---- HTTPS with a self-signed cert (port published as 8443) ----
    # This is what makes the phone a "secure context", so the browser allows GPS.
    server {
        listen 443 ssl;
        server_name _;

        ssl_certificate     /etc/nginx/certs/dev.crt;
        ssl_certificate_key /etc/nginx/certs/dev.key;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        # API and live-tracking WebSocket are served from the SAME origin as the
        # site, so cookies/CORS "just work" — no cross-site cookie headaches.
        location /api/ { proxy_pass http://backend_api; }
        location /ws/  { proxy_pass http://backend_api; }
        location /     { proxy_pass http://frontend_app; }
    }
}
