services:
  frontend:
    build: .
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - /app/node_modules
    env_file:
      - .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    stdin_open: true
    tty: true
    restart: unless-stopped
    networks:
      - app-network

  nginx:
    image: nginx:alpine
    ports:
      - "8080:80"
      - "8443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./nginx/conf.d:/etc/nginx/conf.d
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - frontend
    restart: unless-stopped
    networks:
      # app-network -> reach the Vite frontend; backend -> reach Django (web:8000).
      - app-network
      - backend

networks:
  app-network:
    driver: bridge
  # The backend compose project's default network, joined so nginx can proxy
  # /api and /ws straight to the `web` container over IPv4.
  backend:
    external: true
    name: backend_default
